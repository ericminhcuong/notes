<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes notes</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Notes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#262626" media="(prefers-color-scheme: dark)">
<style>
:root{--bg:#fff;--side:#f5f4f1;--ink:#1d1d1f;--mute:#86868b;--line:#e5e3df;--sel:#f7d775;--sel-ink:#1d1d1f;--accent:#c99a00;--ok:#34a853;--warn:#c48a00;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#1e1e1e;--side:#262626;--ink:#f2f2f2;--mute:#9a9a9f;--line:#353535;--sel:#7a6420;--sel-ink:#fff;--accent:#f2c230}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:clamp(200px,28vw,290px) 1fr;height:100vh;height:100dvh}
aside{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding-top:env(safe-area-inset-top)}
.s-head{display:flex;align-items:center;gap:8px;padding:14px 14px 8px}
.s-head h1{font-size:15px;font-weight:600;margin:0;flex:1}
.icon{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--mute)}
.icon:hover{background:rgba(127,127,127,.15);color:var(--ink)}
.icon svg{width:19px;height:19px}
.search{margin:0 12px 8px;border:0;background:rgba(127,127,127,.14);border-radius:8px;padding:6px 10px;outline:none;width:calc(100% - 24px)}
.s-scroll{overflow:auto;flex:1;padding:0 8px 16px;-webkit-overflow-scrolling:touch}
.item{display:block;width:100%;text-align:left;border-radius:8px;padding:7px 10px;margin:1px 0}
.item:hover{background:rgba(127,127,127,.10)}
.item.on{background:var(--sel);color:var(--sel-ink)}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.on .s{color:inherit;opacity:.75}
.item .d{margin-right:6px}
.row{display:flex;align-items:center;gap:8px;font-weight:500}
.row .n{margin-left:auto;color:var(--mute);font-size:12px;font-weight:400}
.fold{display:flex;align-items:center;gap:6px;width:100%;text-align:left;border-radius:8px;padding:7px 10px;margin:1px 0;font-weight:500}
.fold:hover{background:rgba(127,127,127,.10)}
.fold .chev{display:inline-block;width:10px;color:var(--mute);transition:transform .15s}
.fold[aria-expanded=true] .chev{transform:rotate(90deg)}
.fold .n{margin-left:auto;color:var(--mute);font-size:12px;font-weight:400}
.sub{padding-left:8px}
.s-label{font-size:11px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin:14px 8px 4px}
.more{color:var(--mute);font-size:12.5px;padding:6px 10px;display:block}
.status{font-size:11.5px;color:var(--mute);padding:8px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:7px;align-items:center;border-top:1px solid var(--line)}
.status button{margin-left:auto;color:var(--accent)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.dot.off{background:var(--warn)} .dot.err{background:#d33} .dot.local{background:var(--mute)}
main{display:flex;flex-direction:column;min-height:0;min-width:0;padding-top:env(safe-area-inset-top)}
.bar{display:flex;align-items:center;gap:4px;padding:8px 14px;min-height:46px}
.bar .when{font-size:12px;color:var(--mute);flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{display:none;color:var(--accent);font-weight:500;padding:4px 6px}
.page{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.page-in{max-width:760px;margin:0 auto;padding:4px 28px 120px}
#text{width:100%;border:0;outline:none;resize:none;background:none;font-size:16px;line-height:1.6;min-height:70vh;padding:0;display:block}
#text::first-line{font-size:24px;font-weight:700;line-height:1.5}
.links{font-size:13px;color:var(--mute);margin-top:18px}
.links button{color:var(--accent);margin-right:10px}
h2{font-size:24px;font-weight:700;margin:6px 0 14px}
.add{width:100%;border:0;border-bottom:1px solid var(--line);outline:none;background:none;font-size:16px;padding:10px 2px;margin-bottom:6px}
.todo{display:flex;gap:12px;align-items:flex-start;padding:9px 2px;border-bottom:1px solid var(--line)}
.chk{width:20px;height:20px;border:1.5px solid var(--mute);border-radius:50%;flex:none;margin-top:2px;display:grid;place-items:center}
.chk.done{background:var(--accent);border-color:var(--accent)}
.chk.done::after{content:"";width:8px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.tt{flex:1;min-width:0;outline:none;font-size:15px;word-break:break-word}
.tt.done{color:var(--mute);text-decoration:line-through}
.x{color:var(--mute);opacity:.4;font-size:18px;line-height:1}
.x:hover{opacity:1}
details summary{cursor:pointer;color:var(--mute);font-size:13px;margin:18px 0 6px}
.empty{color:var(--mute);padding:14px 2px}
.pill{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px}
.pill.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--mute)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.arow{display:block;width:100%;text-align:left;padding:9px 2px;border-bottom:1px solid var(--line)}
.arow .t{font-weight:600} .arow .s{color:var(--mute);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint{font-size:12.5px;color:var(--mute);margin-top:12px;line-height:1.6}
.keep{color:var(--accent);font-weight:500;font-size:13px;padding:4px 8px}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40}
.toast.show{opacity:1}
@media (max-width:620px){
  .app{grid-template-columns:1fr}
  .app[data-pane=main] aside{display:none}
  .app[data-pane=list] main{display:none}
  aside{border-right:0}
  .back{display:inline-block}
  .page-in{padding:4px 18px 120px}
}
</style>
</head>
<body>
<div class="app" id="app" data-pane="main">
  <aside>
    <div class="s-head">
      <h1>Mes notes</h1>
      <button class="icon" id="newBtn" title="Nouvelle note (⌘N)" aria-label="Nouvelle note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
    </div>
    <input class="search" id="q" type="search" placeholder="Rechercher">
    <div class="s-scroll" id="side"></div>
    <div class="status"><span class="dot" id="dot"></span><span id="status"></span><button id="syncBtn" hidden></button></div>
  </aside>
  <main>
    <div class="bar" id="bar"></div>
    <div class="page"><div class="page-in" id="page"></div></div>
  </main>
</div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
